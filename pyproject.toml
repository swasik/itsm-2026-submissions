[project]
name = "itsm-2026-submissions"
version = "0.1.0"
description = "Acceptance receipts for the ITSM 2026 course: issue form, workflow and parser"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
